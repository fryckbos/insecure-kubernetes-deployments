name: Snyk Analysis

on: 
  workflow_dispatch:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  snyk:
    name: Pixee Snyk Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@b98d498629f1c368650224d6d212bf7dfa89e4bf # 0.4.0
      - name: Run Snyk Code
        run: snyk code test --org=personal-S75uTmrVsW9D2mctWJPs9d --sarif-file-output=pixee-snyk.sarif.json
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Remediate Snyk Findings with Pixee
        uses: pixee/upload-tool-results-action@9394b64cae9cd00d86095b2b8dc6423d45507434 # v2.5.0
        with:
          tool: snyk
          file: pixee-snyk.sarif.json
          pixee-api-url: "https://latio.getpixee.com"